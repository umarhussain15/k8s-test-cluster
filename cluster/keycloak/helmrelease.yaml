apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: keycloak
spec:
  interval: 5m
  chart:
    spec:
      chart: keycloak
      version: "24.x.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 10m
  values:
    global:
      security:
        allowInsecureImages: true
    auth:
      adminUser: keycloak-admin
      existingSecret: keycloak-admin-password
      passwordSecretKey: adminPassword
    proxy: edge
    production: true
    replicaCount: 1
    resources:
      limits:
        cpu: 1
        memory: 2Gi
      requests:
        cpu: 0.5
        memory: 500Mi
    ingress:
      enabled: false
    adminIngress:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    postgresql:
      image:
        tag: 16.4.0-debian-12-r14 # pin postgres version to 16 as keycloak only supports this in v26
      # architecture: replication
      auth:
        username: bn_keycloak
        existingSecret: keycloak-admin-password
        secretKeys:
          userPasswordKey: postgresPassword
          adminPasswordKey: postgresPassword